services:
  app:
    build: .
    container_name: manage_api_keys_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./log:/var/www/html/log
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: manage_api_keys_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: api_keys_db
      MYSQL_USER: user_root
      MYSQL_PASSWORD: passw_root
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_create_manage_keys.sql:/docker-entrypoint-initdb.d/001_create_manage_keys.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
