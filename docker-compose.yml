services:
  app:
    build: .
    container_name: manage_api_keys_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: manage_api_keys_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: api_keys_db
      MYSQL_USER: user_root
      MYSQL_PASSWORD: passw_root
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
